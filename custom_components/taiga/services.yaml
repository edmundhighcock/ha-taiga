change_status:
  name: Change Status
  description: Move a user story or task to a different status
  fields:
    item_type:
      name: Item Type
      description: Type of item (user_story or task)
      required: true
      selector:
        select:
          options:
            - user_story
            - task
    item_id:
      name: Item ID
      description: The Taiga ID of the item
      required: true
      selector:
        number:
          min: 1
          mode: box
    status_name:
      name: Status Name
      description: Target status name (e.g., "In progress", "Done")
      required: true
      selector:
        text:
    project_id:
      name: Project ID
      description: Project ID (required if multiple projects tracked)
      required: false
      selector:
        number:
          min: 1
          mode: box

create_user_story:
  name: Create User Story
  description: Create a new user story in Taiga
  fields:
    project_id:
      name: Project ID
      description: The Taiga project ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    subject:
      name: Subject
      description: The title of the user story
      required: true
      selector:
        text:
    description:
      name: Description
      description: Optional description
      required: false
      selector:
        text:
          multiline: true
    status_name:
      name: Initial Status
      description: Optional initial status name
      required: false
      selector:
        text:
    epic_id:
      name: Epic ID
      description: Optional epic to assign to
      required: false
      selector:
        number:
          min: 1
          mode: box
    tags:
      name: Tags
      description: Comma-separated tags (or a list of tag strings when called from a script/automation)
      required: false
      selector:
        text:
    due_date:
      name: Due Date
      description: Optional due date, as an ISO date (YYYY-MM-DD)
      required: false
      selector:
        text:

create_task:
  name: Create Task
  description: Create a new task in Taiga
  fields:
    project_id:
      name: Project ID
      description: The Taiga project ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    subject:
      name: Subject
      description: The title of the task
      required: true
      selector:
        text:
    user_story_id:
      name: User Story ID
      description: Optional parent user story
      required: false
      selector:
        number:
          min: 1
          mode: box
    status_name:
      name: Initial Status
      description: Optional initial status name
      required: false
      selector:
        text:
    due_date:
      name: Due Date
      description: Optional due date, as an ISO date (YYYY-MM-DD)
      required: false
      selector:
        text:

update_user_story:
  name: Update User Story
  description: Modify an existing user story's subject, description, tags, or due date
  fields:
    project_id:
      name: Project ID
      description: The Taiga project ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    user_story_id:
      name: User Story ID
      description: The Taiga ID of the user story to update
      required: true
      selector:
        number:
          min: 1
          mode: box
    subject:
      name: Subject
      description: New subject/title for the user story
      required: false
      selector:
        text:
    description:
      name: Description
      description: New description for the user story
      required: false
      selector:
        text:
          multiline: true
    tags:
      name: Tags
      description: Comma-separated tags (or a list of tag strings when called from a script/automation)
      required: false
      selector:
        text:
    due_date:
      name: Due Date
      description: >-
        Optional due date, as an ISO date (YYYY-MM-DD). Pass an empty
        value to clear an existing due date.
      required: false
      selector:
        text:

update_task:
  name: Update Task
  description: Modify an existing task's subject, description, or due date
  fields:
    project_id:
      name: Project ID
      description: The Taiga project ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    task_id:
      name: Task ID
      description: The Taiga ID of the task to update
      required: true
      selector:
        number:
          min: 1
          mode: box
    subject:
      name: Subject
      description: New subject/title for the task
      required: false
      selector:
        text:
    description:
      name: Description
      description: New description for the task
      required: false
      selector:
        text:
          multiline: true
    due_date:
      name: Due Date
      description: >-
        Optional due date, as an ISO date (YYYY-MM-DD). Pass an empty
        value to clear an existing due date.
      required: false
      selector:
        text:

add_comment:
  name: Add Comment
  description: Add a comment to a user story, task, issue, or epic
  fields:
    project_id:
      name: Project ID
      description: The Taiga project ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    item_type:
      name: Item Type
      description: Type of item to comment on
      required: true
      selector:
        select:
          options:
            - user_story
            - task
            - issue
            - epic
    item_id:
      name: Item ID
      description: The Taiga ID of the item to comment on
      required: true
      selector:
        number:
          min: 1
          mode: box
    comment:
      name: Comment
      description: The comment text
      required: true
      selector:
        text:
          multiline: true

refresh:
  name: Refresh
  description: Force refresh Taiga data
